[package]
name = "rust-image-builder"
default-run = "rib"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Daemonless OCI image builder optimized for reproducible COPY layers"
readme = "README.crates.io.md"
documentation = "https://kuzmenkodm.github.io/rib/en/"
license = "MIT"
repository = "https://github.com/kuzmenkodm/rib"
keywords = ["oci", "container", "image", "docker", "jib"]
categories = ["command-line-utilities", "development-tools::build-utils", "development-tools::cargo-plugins"]

[lib]
name = "rib"
path = "src/lib.rs"

[[bin]]
name = "rib"
path = "src/main.rs"

[[bin]]
name = "cargo-rib"
path = "src/bin/cargo-rib.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
base64 = "0.23.1"
dirs = "6.0.0"
anyhow = "1.0.102"
tar = "0.4.45"
flate2 = "1.1.9"
zstd = "0.13.3"
futures-util = "0.3.34"
sha2 = { version = "0.10.0", features = ["std"] }
hex = "0.4.3"
walkdir = "2.5.0"
glob = "0.3.3"
bytes = "1.12.1"
oci-client = { version = "0.17.0", default-features = false, features = ["rustls-tls"] }
oci-spec = "0.10.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
indicatif = "0.18.6"
tempfile = "3.27.0"
secrecy = "0.10.3"
shlex = "2.0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
