name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: Verify tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Verify tag matches Cargo package version
        shell: bash
        run: |
          package_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "rust-image-builder") | .version'
          )"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo package version v${package_version}" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rib-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: rib-alpine-x86_64
            musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rib-windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.musl == true
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="rib-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${archive}" \
            -C "target/${{ matrix.target }}/release" \
            rib cargo-rib
          sha256sum "dist/${archive}" > "dist/${archive}.sha256"

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "rib-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          $binaries = @(
            "target/${{ matrix.target }}/release/rib.exe"
            "target/${{ matrix.target }}/release/cargo-rib.exe"
          )
          Compress-Archive -Path $binaries -DestinationPath "dist/$archive"
          $digest = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower()
          "$digest  $archive" | Set-Content "dist/$archive.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
